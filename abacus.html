<!doctype html>
<html lang="en" class="is-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abacus — Nyxdesk</title>
<meta name="theme-color" content="#5c7a2e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/abacus.css">
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
</head>
<body data-app="abacus">
<div class="app">

  <div class="bar">
    <a class="home" href="./" title="Home"><span class="mark"><svg viewBox="0 0 24 24"><path d="M6 19V5l12 14V5"/></svg></span><span class="wm">Nyxdesk</span></a>
    <span class="appname">Abacus</span>
    <button class="btn filebtn" id="fileMenuBtn"><i data-i="chevD"></i>File</button>
    <input class="title-in" id="docTitle" value="Untitled spreadsheet" aria-label="Spreadsheet title" spellcheck="false">
    <span class="savestate" id="savestate">Not saved yet</span>
    <span class="sp"></span>
    <button class="ib" data-theme-toggle title="Switch theme"><i data-i="moon"></i></button>
    <button class="btn pri hide-phone" id="shareBtn"><i data-i="dl"></i>Export</button>
  </div>

  <div class="ribbon" id="ribbon">
    <div class="rtabs" role="tablist">
      <button class="rtab" data-p="home" role="tab">Home</button>
      <button class="rtab" data-p="insert" role="tab">Insert</button>
      <button class="rtab" data-p="formulas" role="tab">Formulas</button>
      <button class="rtab" data-p="data" role="tab">Data</button>
      <button class="rtab" data-p="view" role="tab">View</button>
    </div>

    <div class="rpanel" data-p="home">
      <div class="rg"><div class="rg-body col"><button class="rb tx" data-cmd="undo"><i data-i="undo"></i></button><button class="rb tx" data-cmd="redo"><i data-i="redo"></i></button></div>
      <div class="rg-body" style="margin-top:2px"><button class="rb" id="copyBtn" title="Copy"><i data-i="copy"></i></button><button class="rb" id="pasteBtn" title="Paste"><i data-i="paste"></i></button></div>
      <div class="rg-label">Clipboard</div></div>

      <div class="rg"><div class="rg-body nw">
        <select class="rs" id="fontFamily" style="width:112px"><option>Inter</option><option>Georgia</option><option>Arial</option><option>Courier New</option><option>Verdana</option></select>
        <select class="rs" id="fontSize" style="width:50px"><option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option><option>16</option><option>20</option><option>24</option></select>
      </div>
      <div class="rg-body nw" style="margin-top:2px">
        <button class="rb" id="boldBtn" title="Bold"><i data-i="bold"></i></button>
        <button class="rb" id="italicBtn" title="Italic"><i data-i="italic"></i></button>
        <button class="rb" id="underlineBtn" title="Underline"><i data-i="underline"></i></button>
        <button class="rb swatch-btn" id="fillBtn" title="Fill color"><i data-i="fill"></i><span class="bar-c" id="fillC"></span></button>
        <button class="rb swatch-btn" id="txColorBtn" title="Text color"><i data-i="fontcolor"></i><span class="bar-c" id="txColorC" style="--c:#24221e"></span></button>
        <button class="rb" id="borderBtn" title="Borders"><i data-i="borders"></i></button>
      </div>
      <div class="rg-label">Font</div></div>

      <div class="rg"><div class="rg-body nw">
        <button class="rb" id="alignLBtn" title="Align left"><i data-i="alignL"></i></button>
        <button class="rb" id="alignCBtn" title="Align center"><i data-i="alignC"></i></button>
        <button class="rb" id="alignRBtn" title="Align right"><i data-i="alignR"></i></button>
        <button class="rb" id="wrapBtn" title="Wrap text"><i data-i="wrap"></i></button>
        <button class="rb" id="mergeBtn" title="Merge cells"><i data-i="merge"></i></button>
      </div><div class="rg-label">Alignment</div></div>

      <div class="rg"><div class="rg-body col" style="min-width:130px">
        <select class="rs" id="numFmt">
          <option value="general">General</option>
          <option value="number">Number</option>
          <option value="currency">Currency</option>
          <option value="percent">Percent</option>
          <option value="date">Date</option>
        </select>
      </div><div class="rg-label">Number</div></div>

      <div class="rg"><div class="rg-body col">
        <button class="rb tx" id="insRowBtn"><i data-i="rowins"></i>Row</button>
        <button class="rb tx" id="insColBtn"><i data-i="colins"></i>Column</button>
      </div><div class="rg-label">Cells</div></div>
    </div>

    <div class="rpanel" data-p="insert">
      <div class="rg"><div class="rg-body">
        <button class="rb big" id="insChartBtn"><i data-i="chartcol"></i>Chart</button>
        <button class="rb big" id="insImgBtn"><i data-i="image"></i>Image</button>
        <button class="rb big" id="insNoteBtn"><i data-i="note"></i>Note</button>
        <button class="rb big" id="insLinkBtn"><i data-i="link"></i>Link</button>
      </div><div class="rg-label">Objects</div></div>
      <div class="rg"><div class="rg-body">
        <button class="rb big" id="insSheetBtn"><i data-i="filetext"></i>New sheet</button>
      </div><div class="rg-label">Sheets</div></div>
    </div>

    <div class="rpanel" data-p="formulas">
      <div class="rg"><div class="rg-body col">
        <button class="rb tx" id="fnBtn"><i data-i="fx"></i>Insert function</button>
        <label class="chk rb tx"><input type="checkbox" id="showFormulasChk"> Show formulas</label>
      </div><div class="rg-label">Function library</div></div>
    </div>

    <div class="rpanel" data-p="data">
      <div class="rg"><div class="rg-body col">
        <button class="rb tx" id="sortAzBtn"><i data-i="sortaz"></i>Sort A→Z</button>
        <button class="rb tx" id="sortZaBtn"><i data-i="sortza"></i>Sort Z→A</button>
      </div><div class="rg-label">Sort</div></div>
      <div class="rg"><div class="rg-body col">
        <label class="chk rb tx"><input type="checkbox" id="filterChk"> Filter</label>
        <label class="chk rb tx"><input type="checkbox" id="freezeChk"> Freeze row 1 &amp; col A</label>
      </div><div class="rg-label">Filter &amp; freeze</div></div>
      <div class="rg"><div class="rg-body col">
        <button class="rb tx" id="dedupBtn"><i data-i="checkbox"></i>Remove duplicates</button>
        <button class="rb tx" id="validBtn"><i data-i="checkbox"></i>Data validation</button>
      </div><div class="rg-label">Clean up</div></div>
    </div>

    <div class="rpanel" data-p="view">
      <div class="rg"><div class="rg-body col">
        <label class="chk rb tx"><input type="checkbox" id="gridlinesChk" checked> Gridlines</label>
        <label class="chk rb tx"><input type="checkbox" id="headersChk" checked> Row/column headers</label>
      </div><div class="rg-label">Show</div></div>
    </div>
  </div>

  <div class="formulabar">
    <span class="cellref" id="cellRef">A1</span>
    <span class="fxlabel"><i data-i="fx"></i></span>
    <input class="inp" id="formulaInput" spellcheck="false" autocomplete="off">
  </div>

  <div class="body">
    <div class="gridwrap" id="gridwrap">
      <div class="sheet" id="sheet"></div>
    </div>
  </div>

  <div class="sheettabs" id="sheetTabs"></div>

  <div class="status">
    <span id="selInfo">A1</span>
    <span class="sp"></span>
    <span id="aggInfo">Sum: 0</span>
  </div>
</div>

<script src="js/abacus.js"></script>
</body>
</html>
