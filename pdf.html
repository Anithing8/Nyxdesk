<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyxdesk PDF</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body{ height:100%; overflow:hidden; }
  .app{ height:100vh; display:flex; flex-direction:column; }
  .body2{ flex:1; display:flex; min-height:0; }

  .rail{
    width: 168px; flex:none; overflow-y:auto; padding: 12px 10px;
    border-right: 1px solid var(--line); background: var(--bg-elevated);
  }
  .pagecard{
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    margin-bottom: 10px; padding: 10px 8px; text-align:center; cursor:pointer;
    background: var(--bg-elevated-2); color: var(--ink-dim); font-size: 12px;
  }
  .pagecard.active{ outline: 2px solid var(--accent); outline-offset: 1px; color: var(--ink); }
  .pagecard .pn{ font-family: var(--font-mono); }
  .pagecard .pdel{ display:block; margin-top:4px; color: var(--danger); font-size: 11px; }

  .stage{ flex:1; overflow-y:auto; background: var(--bg); padding: 28px 0 120px; display:flex; flex-direction:column; align-items:center; gap: 22px; }
  .pageWrap{ position:relative; background:#fff; box-shadow: 0 14px 30px rgba(0,0,0,0.32); }
  .pageWrap canvas{ display:block; }
  .pageWrap.blank{ background:#fff; border:1px dashed #ccc; }
  .overlay{ position:absolute; inset:0; }
  .overlay svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .ann{ position:absolute; box-sizing:border-box; cursor:move; }
  .ann.selected{ outline: 2px solid var(--focus); }
  .ann[data-type="text"]{ padding: 2px 4px; font-family: Arial, sans-serif; color:#111; line-height:1.2; overflow:hidden; }
  .ann[data-type="text"][contenteditable="true"]{ cursor:text; }
  .ann[data-type="highlight"]{ background: rgba(255, 224, 90, 0.45); }
  .ann[data-type="rect"]{ border: 2px solid #e0475a; background: rgba(224,71,90,0.08); }
  .pageLabel{ position:absolute; top:-22px; left:0; font-size:11px; color:var(--ink-faint); font-family: var(--font-mono); }

  .drop{
    flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    color: var(--ink-dim); text-align:center; padding: 40px;
  }
  .drop .z{ border: 1px dashed var(--line); border-radius: var(--radius-md); padding: 40px 60px; }

  @media (max-width: 760px){
    .topbar__module{ display:none; }
    .rail{ width: 128px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="rail-toggle" id="railToggle" aria-label="Toggle pages">☰</button>
    <a class="topbar__brand" href="index.html"><span class="dot"></span>Nyxdesk</a>
    <span class="topbar__module">PDF</span>

    <div class="menu" id="fileMenu">
      <button class="btn btn--ghost" onclick="toggleMenu('fileMenu')">File ▾</button>
      <div class="menu__panel">
        <button class="menu__item" onclick="triggerOpen()">Open PDF…</button>
        <button class="menu__item" onclick="newBlankPdf()">New blank PDF</button>
        <div class="menu__sep"></div>
        <button class="menu__item" onclick="exportPdf()">Save edited PDF</button>
      </div>
    </div>
    <input type="file" id="openInput" accept="application/pdf" class="hidden">
    <input class="field" id="pdfTitle" value="document" style="width:150px" aria-label="File name">

    <div class="topbar__spacer"></div>
    <div class="topbar__actions">
      <button class="icon-btn" onclick="nyxToggleTheme()" title="Toggle theme">◐</button>
      <button class="btn btn--primary" onclick="exportPdf()"><span class="label-full">Save </span>PDF</button>
    </div>
  </div>

  <div class="toolbar2" id="editToolbar" style="display:none">
    <button class="icon-btn tool active" data-tool="select" title="Select / move">↖</button>
    <button class="icon-btn tool" data-tool="text" title="Add text">T</button>
    <button class="icon-btn tool" data-tool="highlight" title="Highlight">▮</button>
    <button class="icon-btn tool" data-tool="rect" title="Rectangle">▭</button>
    <button class="icon-btn tool" data-tool="draw" title="Draw / sign">✎</button>
    <span class="sep"></span>
    <button class="btn btn--ghost" onclick="deleteSelectedAnn()">Delete annotation</button>
    <span class="sep"></span>
    <button class="btn" onclick="zoomOut()">−</button>
    <span id="zoomLabel" class="mini" style="min-width:44px;text-align:center;display:inline-block">100%</span>
    <button class="btn" onclick="zoomIn()">+</button>
    <span class="sep"></span>
    <button class="btn" onclick="rotateActivePage()">Rotate page</button>
    <button class="btn" onclick="deleteActivePage()">Delete page</button>
    <button class="btn" onclick="addBlankPage()">+ Blank page</button>
  </div>

  <div class="body2">
    <aside class="rail" id="rail"></aside>
    <div class="stage" id="stage">
      <div class="drop" id="dropZone">
        <div class="z">
          <p style="margin-bottom:10px">Open a PDF to view and mark it up, or start a new blank one.</p>
          <div style="display:flex; gap:10px; justify-content:center">
            <button class="btn btn--primary" onclick="triggerOpen()">Open PDF…</button>
            <button class="btn" onclick="newBlankPdf()">New blank PDF</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/pdf.js"></script>
</body>
</html>
